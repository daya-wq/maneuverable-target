# origin
update_sim: True
name: crazyflie
target_clip: 0.8
min_thrust_ratio: 0.0
max_thrust_ratio: 0.9
fixed_yaw: 0
inertia:
  xx: 1.4e-5
  xy: 0.0
  xz: 0.0
  yy: 1.4e-5
  yz: 0.0
  zz: 2.17e-5
mass: 0.0321
l: 0.096
# Body-frame linear drag coefficients in 1/s.
# Source: N.O. Abuter Grebe, "Differential Dynamic Programming for Aerial
# Robots using an Aerodynamics Model", TU Delft, 2017, p.49. The identified
# lateral body-frame coefficients are Cx = Cy = 0.0195 N·s/m. Using the same
# magnitude for z gives a conservative, strictly dissipative 6-DoF drag model
# for aggressive flight. With mass 0.0321 kg this becomes:
#   kx = ky = 0.6075 1/s
#   kz = 0.4206 1/s
#
# The same thesis also identifies a negative vertical net aerodynamic term
# Cz = -0.0135 N·s/m. We do not encode that as ordinary body-z drag here,
# because doing so lets large-pitch forward flight convert horizontal speed
# into a non-physical body-z acceleration channel. Instead it is modeled
# separately below as an optional world-vertical aerodynamic correction.
drag_coef: [0.6075, 0.6075, 0.4206]

# World-vertical net aerodynamic coefficient in 1/s, derived from the thesis'
# Cz = -0.0135 N·s/m / 0.0321 kg = 0.4206 1/s. This is applied only to world
# vertical velocity, acting as a vertical inflow / thrust-efficiency correction
# rather than a generic body-z drag term.
vertical_aero_coef: 0.0
rotor_configuration:
  arm_lengths:
  - 0.043
  - 0.043
  - 0.043
  - 0.043
  directions:
  - -1.0
  - 1.0
  - -1.0
  - 1.0
  force_constants:
  # 1/4mg = (mean_hover_pwm / 2**16) * omega_max^2 * force_constants
  # force_constants = 1/4mg * kf / omega_max^2
  # kf = force_constants * omega_max^2 / 1/4mg
  - 2.350347298350041e-08 # simopt1
  - 2.350347298350041e-08
  - 2.350347298350041e-08
  - 2.350347298350041e-08
  max_rotation_velocities:     
  - 2315      # 16mm dc motor -- 14000 rpm/v 3.7V --> 863 rps
  - 2315
  - 2315
  - 2315
  moment_constants:
  - 7.24e-10 # origin
  - 7.24e-10
  - 7.24e-10
  - 7.24e-10
  num_rotors: 4
  rotor_angles:
  - 0.78539816
  - 2.35619449
  - 3.92699082
  - 5.49778714
  time_constant: 0.025 # 0.4, DATT, tau = dt / time_constant
  noise_scale: 0.0 # default: 2% noise for rotor speed
controller_configuration: # invalid
  gain:
  - 0.0052
  - 0.0052
  - 0.00025
