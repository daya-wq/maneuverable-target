name: HideAndSeek

defaults:
  # see https://hydra.cc/docs/advanced/overriding_packages/
  - /base/env_base@_here_
  - /base/sim_base@_here_

env:
  num_envs: 100
  max_episode_length: 1200

drone_model: Crazyflie
force_sensor: false
time_encoding: true

action_transform: none
guidance_mode: ot_residual

# exp
max_agents: 4
num_agents: 3

# flag
use_partial_obs: 1
use_eval: 1 # eval/training both use the front_box random reset when configured below
scenario_flag: 'goal_defense'
use_role_encoding: false

# TP net param
history_step: 10
future_predcition_step: 10
window_step: 1

ot_guidance:
  enabled: true
  predictor_checkpoint: null
  predictor_obs_dim: 30
  train_predictor: true
  predictor_guidance_warmup_updates: 20
  prediction_horizon: 10
  dt_pred: 0.05
  sinkhorn_iters: 24
  sinkhorn_epsilon: 2.0
  block_distance: 0.45
  goal_distance: 0.55
  evade_forward: 0.35
  evade_side: 0.55
  kp: 5.0
  kv: 2.0
  base_accel_limit: 6.0
  residual_accel_limit: 1.5
  residual_warmup_progress: 0.25
  residual_warmup_min_scale: 0.15
  pursuer_accel_limit: 8.0
  pursuer_horizontal_accel_limit: 5.0
  pursuer_vertical_accel_limit: 6.5
  pursuer_max_tilt_deg: 50.0
  pursuer_rate_fraction: 1.0
  pursuer_yaw_heading_blend: 0.0
  pursuer_floor_barrier_height: 0.90
  pursuer_floor_hard_z: 0.30
  pursuer_floor_target_margin: 0.10
  pursuer_floor_prediction_time: 0.30
  pursuer_floor_recovery_margin: 0.65
  pursuer_floor_barrier_max_accel: 5.5
  pursuer_floor_xy_scale_min: 0.20
  pursuer_floor_barrier_gain: 12.0
  pursuer_floor_barrier_damping: 5.0
  reward_coef: 0.20
  ref_coef: 0.15
  mode_coef: 0.15
  line_coef: 0.20
  variance_weight_scale: 1.0
  variance_weight_floor: 0.10
  min_ref_z: 0.90
  hard_floor_z: 0.30
  low_target_ref_margin: 0.10
  traj_mass_base: 0.35
  traj_mass_far: 0.15
  traj_mass_close: 0.45
  channel_forward_fraction: 0.78
  channel_min_forward: 2.20
  channel_lateral_spread: 0.65
  channel_mass_base: 0.60
  channel_mass_far: 2.40
  channel_mass_goal_priority: 2.20
  channel_mass_goal_sprint: 3.00
  ref_forward_floor: 1.80
  ref_lateral_spread: 0.65
  ref_channel_blend: 0.70
  ref_lateral_blend: 0.90
  ref_min_separation: 0.85
  ref_separation_gain: 0.70
  ref_separation_iters: 3
  terminal_forward_min: 0.12

reset_profile:
  # Single OT-residual reset profile. This replaces the legacy curriculum
  # scheduler so initial geometry is explicit and stable across train/eval.
  pursuer_spawn_mode: front_box
  goal_side_angle_deg: 65.0
  goal_side_angle_jitter_deg: 10.0
  target_spawn_x: [-0.9, -0.2]
  target_spawn_y: [-1.0, 1.0]
  front_box_target_x: [-5.4, -4.8]
  front_box_target_y: [-0.8, 0.8]
  front_box_drone_x: [4.3, 5.3]
  front_box_drone_y: [-0.8, 0.8]
  front_box_max_z_diff: 0.6
  target_z_jitter: 0.15
  drone_z_jitter: 0.15
  drone_min_separation: 1.00
  max_sample_attempts: 64
  stages:
    - pursuer_target_dist: [9.0, 10.5]
      pursuer_speed: 3.0
      target_speed: 3.0

arena_size: 6.0
max_height: 5.0
v_drone: 3.0
v_prey: 1.0  # multiplier: target max speed = v_drone * v_prey = 3 m/s

# normalized goal-defense reward
# First priority: actually catch the target.
# Dense shaping is kept, but weakened so it helps the chase
# instead of replacing the real task objective.
catch_reward_coef: 50.0
goal_penalty_coef: 40.0
timeout_penalty_coef: 8.0
reward_profile: ot_residual
spread_reward_coef: 0.0
goal_progress_coef: 0.0
capture_progress_coef: 0.0
goal_progress_scale: 0.05
capture_progress_scale: 0.05
soft_separation_start: 0.40
soft_separation_end: 0.20
soft_separation_penalty_coef: 2.0
coop_phi_coef: 0.0
coop_diff_coef: 0.0
coop_reward_init: 0.0
coop_reward_final: 0.0
coop_anneal_portion: 0.50
di_scale: 0.15
urgent_goal_dist: 0.80
urgent_goal_tau: 0.15
block_margin: 0.15
block_softness: 0.10
block_between_softness: 0.15
block_lateral_scale: 0.35
pressure_dist_scale: 0.80
collision_coef: 40.0
speed_coef: 0.0
smoothness_coef: 0.0
time_penalty_coef: 0.0
ground_collision_height: 0.10
landed_z_threshold: 0.01
landed_speed_threshold: 0.10
landed_penalty_coef: 40.0

# goal-defense target dynamics
goal_region_radius: 0.5
goal_region_height: 1.0
goal_region_center: [4.0, 0.0, 2.5]
target_dynamics_mode: uav  # point_mass: bounded sphere integrator; uav: APF velocity/acc command through multirotor dynamics
target_drone_model: Crazyflie
target_goal_attraction_coef: 1.0
target_accel_limit: 3.5
target_repulsion_coef: 1.0
target_velocity_damping: 0.25
target_command_tau: 0.05
target_uav_velocity_gain: 4.5
target_uav_max_tilt_deg: 45.0
target_uav_rate_fraction: 1.0
target_uav_acc_feedforward_scale: 1.0
target_physics_max_velocity: 3.0
target_min_z: 0.2
target_tactical_far_distance: 10.5
target_goal_sprint_distance: 1.0
target_far_goal_gain: 1.0
target_near_goal_gain: 1.0
target_goal_sprint_gain: 1.25
target_goal_sprint_repulsion_scale: 0.70
target_opt_maneuver_evade_weight: 2.0
target_opt_maneuver_goal_weight: 3.0
target_opt_maneuver_lateral_weight: 0.55
target_opt_maneuver_turn_weight: 0.35
target_opt_maneuver_height_weight: 4.0
target_opt_maneuver_boundary_weight: 3.0
target_goal_priority_gain: 1.8
target_goal_priority_repulsion_scale: 0.80
target_nearest_repulsion_coef: 2.4
target_other_repulsion_coef: 1.3
target_maneuver_force_coef: 2.2
target_maneuver_forward_scale: 0.15
target_maneuver_vertical_scale: 0.65
target_maneuver_speed_threshold: 0.3
target_maneuver_min_steps: 8
target_maneuver_max_steps: 24
target_maneuver_lookahead_steps: 10
target_maneuver_lookahead_dt: 0.05

# env param
catch_radius: 0.4
drone_detect_radius: 100.0
target_detect_radius: 100.0
collision_radius: 0.07
