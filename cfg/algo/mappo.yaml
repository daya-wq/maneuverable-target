name: mappo

# ppo
train_every: 128
num_minibatches: 16
ppo_epochs: 1
predictor:
  enabled: true
  lr: 0.0003
  epochs: 1
  num_minibatches: 4
  lambda_strategic: 1.0
  lambda_gmm: 1.0
  lambda_speed: 0.02
  lambda_accel: 0.02
  lambda_height: 0.0
  dt_pred: 0.05
  max_speed: 3.0
  max_accel: 3.0
clip_param: 0.1
entropy_coef: 0.001
entropy_schedule:
  enabled: false
  hold_coef: 0.001
  release_coef: 0.001
  success_threshold: 0.60
  success_target: 0.80
  ema_alpha: 0.05
  min_env_frames: 5000000
gae_lambda: 0.95
gamma: 0.995
max_grad_norm: 10.0
normalize_advantages: True

warmstart:
  actor_freeze:
    enabled: false
    frames: 5000000
  actor_lr_warmup:
    enabled: false
    frames: 100000000
    lr_init: 0.000004
    lr_final: ${algo.actor.lr}
  critic_lr_warmup:
    enabled: false
    frames: 0
    lr_init: ${algo.critic.lr}
    lr_final: ${algo.critic.lr}
  actor_log_std_schedule:
    enabled: false
    reset_on_curriculum_stage: true
    adaptive_release:
      enabled: false
      min_frames: 100000000
      success_threshold: 0.70
      mse_threshold: 0.01
      consecutive_evals: 1
      step_frames: 20000000
      init_std: 0.01
      std_increment: 0.01
      max_std: 0.05
    frames:
      - 0
      - 100000000
      - 120000000
      - 140000000
      - 160000000
      - 180000000
    values:
      - -4.605170
      - -4.605170
      - -4.199705
      - -3.912023
      - -3.688879
      - -2.995732
  kl_reg:
    enabled: true
    target_kl: 0.02
    coef: 0.0
    hard_stop: true
  anchor:
    enabled: false
    coef_init: 0.0
    coef_final: 0.0
    decay_frames: 0
    loss_type: mse

reward_weights: null # null means all 1.0
share_actor: True
critic_input: state # `obs` or `state`

actor:
  # Verified with 512 envs x 128 steps, 16 minibatches and one PPO epoch.
  lr: 0.000003
  lr_scheduler: torch.optim.lr_scheduler.CosineAnnealingWarmRestarts
  lr_scheduler_kwargs:
    T_0: 2000
    T_mult: 2
    eta_min: 0.0000003
  
  # mlp
  hidden_units: [256, 256, 256]
  layer_norm: true

  weight_decay: 0.0
  gain: 0.01

  vision_encoder: MobileNetV3Small
  # Raw history + GMM + strategic intent -> cooperative future tokens.
  # The stochastic head predicts 10 bounded relative-position/velocity knots.
  attn_encoder: CooperativeTrajectoryEncoder
  use_orthogonal: true

  tanh: true
  # Learn one log_std per output channel; project only after optimization/load.
  # sigma starts at exp(-1.5) ~= 0.223 in the pre-tanh action coordinates.
  project_log_std: true
  log_std_init: -1.5
  log_std_min: -3.0
  log_std_max: 0.0

  # rnn:
  #   cls: gru
  #   kwargs:
  #     hidden_size: 128
  #   train_seq_len: 16

critic:
  num_critics: 1
  value_norm:
    class: ValueNorm1
    kwargs: 
      beta: 0.995

  lr: 0.0001
  lr_scheduler: torch.optim.lr_scheduler.CosineAnnealingWarmRestarts
  lr_scheduler_kwargs:
    T_0: 1000
    T_mult: 2
    eta_min: 0.00001

  # mlp
  hidden_units: [256, 256, 256]
  layer_norm: true

  weight_decay: 0.0
  gain: 0.01

  use_huber_loss: true
  huber_delta: 10

  # rnn:
  #   cls: gru
  #   kwargs:
  #     hidden_size: 128
  #   train_seq_len: 16

  vision_encoder: MobileNetV3Small
  attn_encoder: RelationEncoder # CTDE critic over global drone + obstacle entities
  use_feature_normalization: true
  use_orthogonal: true
